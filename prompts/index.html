<style>:root{--ps-a:var(--rose,#FF6FA5);--ps-soft:var(--rose-pale,#FFD9E8);--ps-line:var(--line,rgba(255,111,165,.18));--ps-ink:var(--ink-dim,#A3809A)}.ps h2::before{content:'♡ ';font-size:.8em}
.ps{max-width:780px;margin:0 auto;padding:0 18px 40px}
.ps h2{font-size:1.25rem;margin:40px 0 12px;color:var(--ps-a)}
.ps .ps-lead{color:var(--ps-ink);line-height:1.9}
.ps-badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.78rem;background:var(--ps-soft);color:var(--ps-a);margin-right:6px}
.ps-ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ps-ex figure{margin:0;background:#fff;border:1px solid var(--ps-line);border-radius:16px;padding:8px}
.ps-ex img{width:100%;height:auto;border-radius:12px;display:block}
.ps-ex figcaption{font-size:.85rem;color:var(--ps-ink);padding:6px 4px 0}
.ps-ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ps-ba .arr{font-size:1.6rem;color:var(--ps-a)}
.ps-steps{counter-reset:s;list-style:none;padding:0;margin:0}
.ps-steps li{counter-increment:s;position:relative;padding:12px 14px 12px 52px;margin:0 0 10px;background:#fff;border:1px solid var(--ps-line);border-radius:14px;line-height:1.8}
.ps-steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--ps-a);color:#fff;text-align:center;line-height:26px;font-size:.9rem}
.ps-box{position:relative;background:#fff;border:2px solid var(--ps-soft);border-radius:16px;padding:18px 16px 16px}
.ps-box pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:.95rem;line-height:1.9;color:#3a3742}
.ps-box mark{background:var(--ps-soft);color:var(--ps-a);font-weight:700;border-radius:6px;padding:0 2px}
.ps-box .ps-key{font-weight:700}
.ps-rules .ps-rights{background:#fff1f3;border:1px solid #f3c2cc;border-radius:10px;padding:8px 10px;color:#9b2340;list-style:none}
.ps-box mark.ps-in{display:inline-block;min-width:7em;border-bottom:2px dashed var(--ps-a);border-radius:4px 4px 0 0;padding:0 4px}
.ps-box mark.ps-in.empty::after{content:"← ここに書く";font-weight:400;opacity:.75;font-size:.85em}
.ps-copy{display:block;width:100%;margin:0 0 12px;border:0;border-radius:14px;padding:14px 16px;background:var(--ps-a);color:#fff;cursor:pointer;font-size:1.02rem;font-weight:700;letter-spacing:.04em;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ps-box pre{cursor:copy}
.ps-toc{background:#fff;border:1px solid var(--ps-line);border-radius:16px;padding:14px 18px;margin:20px 0}
.ps-toc p{margin:0 0 6px;font-weight:700;color:var(--ps-a)}
.ps-toc ol{margin:0;padding-left:1.4em;line-height:2}
.ps-toc a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--ps-line)}
.ps h2{scroll-margin-top:72px}
.ps-chat{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.ps-chat.r{flex-direction:row-reverse}
.ps-chat img,.ps-chat .ic{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--ps-soft);background:var(--ps-soft)}
.ps-chat .ic{display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--ps-a)}
.ps-chat .who{font-size:.78rem;color:var(--ps-a);margin:0 4px 2px}
.ps-chat.r .who{text-align:right}
.ps-chat .bub{background:#fff;border:1px solid var(--ps-line);border-radius:16px;padding:10px 14px;line-height:1.8;font-size:.95rem}
.ps-copy.done{background:#5fb58a}
.ps-copyarea{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.ps-vars{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff;border-radius:14px;overflow:hidden}
.ps-vars th,.ps-vars td{border-bottom:1px solid var(--ps-line);padding:10px;text-align:left;vertical-align:top;line-height:1.7}
.ps-vars th{background:var(--ps-soft);color:var(--ps-a);white-space:nowrap}
.ps-note{background:var(--ps-soft);border-radius:14px;padding:14px 16px;line-height:1.85;font-size:.93rem}
.ps-rules li{line-height:1.9}
.ps-dl{display:inline-block;margin:4px 8px 4px 0;padding:9px 18px;border-radius:999px;border:1px solid var(--ps-a);color:var(--ps-a);text-decoration:none;font-size:.9rem;background:#fff}
.ps-r18{border:2px solid #ff7fae;background:#241832;color:#f6ecfa;border-radius:16px;padding:14px 16px;line-height:1.8}
@media(max-width:560px){.ps-ba{grid-template-columns:1fr}.ps-ba .arr{transform:rotate(90deg);text-align:center}.ps-vars,.ps-vars tbody,.ps-vars tr,.ps-vars th,.ps-vars td{display:block;width:auto;white-space:normal}.ps-vars tr:first-child{display:none}.ps-vars tr{border-bottom:1px solid var(--ps-line);padding:4px 0}.ps-vars th,.ps-vars td{border:0;padding:6px 12px}}
.ps{overflow-wrap:anywhere}.ps-vars td,.ps-vars th{overflow-wrap:anywhere}.ps img{max-width:100%}

.bn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:18px 0}
.bn-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--ps-line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.bn-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.bn-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--ps-soft)}
.bn-card .noimg{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:var(--ps-soft);color:var(--ps-a);font-weight:700;font-size:1.1rem;text-align:center;padding:10px}
.bn-card .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.bn-card .meta{font-size:.75rem;color:var(--ps-ink)}
.bn-card .meta b{display:inline-block;background:var(--ps-soft);color:var(--ps-a);border-radius:999px;padding:1px 8px;margin-right:4px;font-weight:700}
.bn-card .tt{font-weight:700;font-size:.92rem;line-height:1.5}
.bn-card .sm{font-size:.8rem;line-height:1.65;color:var(--ps-ink)}
@media(max-width:400px){.bn-grid{grid-template-columns:1fr 1fr;gap:10px}.bn-card .tx{padding:8px 9px 10px}.bn-card .tt{font-size:.84rem}.bn-card .sm{font-size:.74rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}}
